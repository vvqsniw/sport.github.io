<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายการอุปกรณ์ทั้งหมด - ระบบยืม-คืนอุปกรณ์กีฬา</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <img src="images/LOGO-SSP.png" alt="logo" class="logo-img">

      <div class="brand-text">
        <p class="th">การยืม-คืนอุปกรณ์กีฬาของกลุ่มสาระการเรียนรู้สุขศึกษาและพลศึกษา</p>
        <p class="en">Sports Equipment Borrowing and Return Management System</p>
      </div>
    </div>

    <div class="profile" id="profileToggle">
      <div class="avatar">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.5c-3.3 0-9.8 1.6-9.8 4.9v2.4h19.6v-2.4c0-3.3-6.5-4.9-9.8-4.9z"/></svg>
      </div>
      <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 9l6 6 6-6"/>
      </svg>

      <div class="profile-menu">
        <a href="profile.html">โปรไฟล์ของฉัน</a>
        <a href="account-settings.html">ตั้งค่าบัญชี</a>
        <a href="#">ติดต่อเรา</a>
      </div>
    </div>
  </header>

  <nav class="navbar">
    <a href="index.html">หน้าหลัก</a>
    <a href="equipment.html" class="active">รายการอุปกรณ์ทั้งหมด</a>
    <a href="booking.html">จองอุปกรณ์</a>
    <a href="history.html">ประวัติการยืม-คืน</a>
  </nav>

  <main>
    <div class="equip-panel">

      <div class="equip-topline">
        <h2 class="equip-title">รายการอุปกรณ์ทั้งหมด</h2>
        <div class="equip-search">
          <input type="text" placeholder="ค้นหาอุปกรณ์...">
          <select>
            <option>ทั้งหมด</option>
            <option>ลูกบอล</option>
            <option>อุปกรณ์ออกกำลังกาย</option>
          </select>
          <button class="btn-search">ค้นหา</button>
        </div>
      </div>

      <div class="category-tabs">
        <button class="tab active">ทั้งหมด</button>
        <button class="tab">ลูกบอล</button>
        <button class="tab">อุปกรณ์ออกกำลังกาย</button>
      </div>

      <div class="equip-grid" id="equipmentGrid"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
